<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* ===== 색과 글씨 (어둡게 버튼을 누르면 아래 dark 색으로 바뀜) ===== */
  :root {
    --bg: #EEF1EC;
    --surface: #FFFFFF;
    --ink: #1E2724;
    --muted: #56615C;
    --line: #D3DAD4;
    --accent: #2C4E9E;
    --calendar: #E7B53C;
    --base-size: 20px;
    color-scheme: light;
  }
  html.dark {
    --bg: #151B19;
    --surface: #202826;
    --ink: #ECEFEA;
    --muted: #A9B3AE;
    --line: #36413D;
    --accent: #9DB6F2;
    --calendar: #C99A2E;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { font-size: var(--base-size); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Gowun Dodum', 'Malgun Gothic', sans-serif;
    line-height: 1.7;
    transition: background .3s, color .3s;
  }
  h1, h2, h3 { font-family: 'Gowun Batang', 'Batang', serif; line-height: 1.3; margin: 0; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* ===== 맨 위: 사이트 이름 + 글씨/어둡게 버튼 ===== */
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 20px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .topbar .name { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 1.1rem; }
  .tools { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: .9rem; color: var(--ink); background: var(--surface);
    border: 2px solid var(--ink); border-radius: 10px; padding: 6px 16px; cursor: pointer;
  }
  button:hover { background: var(--bg); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ===== 첫 화면 ===== */
  .hero { padding: 64px 0 40px; }
  .hero h1 { font-size: 2.6rem; }
  .hero p { font-size: 1.1rem; color: var(--muted); max-width: 32em; margin: 16px 0 0; }

  /* ===== D-day, 날씨, 음악 ===== */
  .today { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 20px; }
  .tile {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; display: flex; flex-direction: column; gap: 8px;
  }
  .tile .label { color: var(--muted); font-size: .9rem; }
  .tile .big { font-family: 'Gowun Batang', serif; font-size: 1.6rem; font-weight: 700; }

  /* D-day는 탁상 달력처럼 */
  .calendar { padding: 0; overflow: hidden; }
  .calendar .rings { background: var(--calendar); height: 28px; }
  .calendar .body { padding: 20px 24px 24px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .calendar .days { font-family: 'Gowun Batang', serif; font-size: 4rem; font-weight: 700; line-height: 1; }
  .calendar .what { font-size: 1.05rem; }

  #musicBtn.playing { background: var(--accent); border-color: var(--accent); color: var(--surface); }

  /* ===== 사진 갤러리 ===== */
  section { padding: 64px 0 0; }
  section h2 { font-size: 1.8rem; margin-bottom: 24px; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .gallery figure { margin: 0; }
  .gallery img {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px;
    cursor: zoom-in; display: block; border: 1px solid var(--line);
  }
  .gallery figcaption { margin-top: 10px; }

  /* 사진을 누르면 크게 보이는 창 */
  .viewer {
    position: fixed; inset: 0; background: rgba(10, 14, 12, .88);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 16px; z-index: 10;
  }
  .viewer.open { display: flex; }
  .viewer img { max-width: 100%; max-height: 78vh; border-radius: 8px; }
  .viewer p { color: #F3F5F2; font-size: 1.1rem; margin: 0; }
  .viewer button { background: #F3F5F2; color: #1E2724; border-color: #F3F5F2; }

  /* ===== 방명록 ===== */
  .guestbook {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; display: grid; gap: 16px; max-width: 640px;
  }
  .guestbook label { display: grid; gap: 6px; }
  .guestbook input, .guestbook textarea {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  .guestbook textarea { min-height: 120px; resize: vertical; }
  .guestbook button[type="submit"] {
    justify-self: start; background: var(--accent); border-color: var(--accent);
    color: var(--surface); font-size: 1rem; padding: 10px 28px;
  }
  .hidden { display: none; }

  footer { padding: 64px 0 48px; color: var(--muted); font-size: .9rem; }

  /* 휴대폰 화면 */
  @media (max-width: 760px) {
    .hero h1 { font-size: 2rem; }
    .today, .gallery { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- 맨 위 -->
  <header class="topbar">
    <span class="name">김○○의 홈페이지</span>
    <div class="tools">
      <button id="smaller" aria-label="글씨 작게">가-</button>
      <button id="bigger" aria-label="글씨 크게">가+</button>
      <button id="darkBtn">어둡게</button>
    </div>
  </header>

  <!-- 첫 화면 -->
  <div class="hero">
    <h1>우리 가족 이야기</h1>
    <p>수원에 사는 김○○입니다. 산에 오르는 것과 손주들 사진 찍는 걸 좋아해요. 우리 가족이 함께한 시간을 여기 모아 둡니다.</p>
  </div>

  <!-- D-day, 날씨, 음악 -->
  <div class="today">
    <div class="tile calendar">
      <div class="rings"></div>
      <div class="body">
        <span class="days" id="ddayNumber">-</span>
        <span class="what" id="ddayText">손주 생일까지</span>
      </div>
    </div>

    <div class="tile">
      <span class="label">오늘 수원 날씨</span>
      <span class="big" id="weather">불러오는 중</span>
    </div>

    <div class="tile">
      <span class="label">우리 집 음악</span>
      <button id="musicBtn">음악 켜기</button>
      <span class="label" id="musicNote"></span>
    </div>
  </div>

  <!-- 사진 갤러리 -->
  <section>
    <h2>추억 사진</h2>
    <div class="gallery">
      <figure>
        <img src="photo1.jpg" alt="가족과 함께 오른 산" data-caption="2023년 가을, 가족과 함께 오른 산">
        <figcaption>2023년 가을, 가족과 함께 오른 산</figcaption>
      </figure>
      <figure>
        <img src="photo2.jpg" alt="제주도 바다" data-caption="2019년 여름, 제주도 바다">
        <figcaption>2019년 여름, 제주도 바다</figcaption>
      </figure>
      <figure>
        <img src="photo3.jpg" alt="마당에 핀 꽃" data-caption="올봄 마당에 핀 꽃">
        <figcaption>올봄 마당에 핀 꽃</figcaption>
      </figure>
    </div>
  </section>

  <!-- 방명록 (Netlify Forms) -->
  <section>
    <h2>방명록</h2>
    <form class="guestbook" name="guestbook" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="guestbook">
      <p class="hidden"><label>비워 두세요 <input name="bot-field"></label></p>
      <label>이름
        <input type="text" name="name" required>
      </label>
      <label>남길 말
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">남기기</button>
    </form>
  </section>

  <footer>들러 주셔서 고맙습니다.</footer>
</div>

<!-- 사진 크게 보기 창 -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <img id="viewerImg" alt="">
  <p id="viewerText"></p>
  <button id="viewerClose">닫기</button>
</div>

<audio id="music" src="music.mp3" loop preload="none"></audio>

<script>
  /* ===== 1. 글씨 크게/작게 ===== */
  const sizes = [18, 20, 22, 24, 26];
  let sizeIndex = 1;
  function setSize() {
    document.documentElement.style.setProperty('--base-size', sizes[sizeIndex] + 'px');
  }
  document.getElementById('bigger').onclick = () => { if (sizeIndex < sizes.length - 1) { sizeIndex++; setSize(); } };
  document.getElementById('smaller').onclick = () => { if (sizeIndex > 0) { sizeIndex--; setSize(); } };

  /* ===== 2. 어둡게 ===== */
  const darkBtn = document.getElementById('darkBtn');
  darkBtn.onclick = () => {
    const isDark = document.documentElement.classList.toggle('dark');
    darkBtn.textContent = isDark ? '밝게' : '어둡게';
  };

  /* ===== 3. D-day (날짜와 문구는 여기서 바꾸기) ===== */
  const ddayDate = new Date(2027, 2, 5);   // 2027년 3월 5일 (월은 0부터 세서 3월 = 2)
  const ddayLabel = '손주 생일까지';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const left = Math.round((ddayDate - today) / 86400000);
  const ddayNumber = document.getElementById('ddayNumber');
  const ddayText = document.getElementById('ddayText');
  if (left > 0) { ddayNumber.textContent = left + '일'; ddayText.textContent = ddayLabel; }
  else if (left === 0) { ddayNumber.textContent = '오늘'; ddayText.textContent = '바로 그날이에요!'; }
  else { ddayNumber.textContent = (-left) + '일'; ddayText.textContent = '지났어요'; }

  /* ===== 4. 오늘 날씨 (Open-Meteo, 열쇠 필요 없음) ===== */
  const weatherNames = {
    0: '맑음', 1: '대체로 맑음', 2: '구름 조금', 3: '흐림', 45: '안개', 48: '안개',
    51: '이슬비', 53: '이슬비', 55: '이슬비', 61: '비', 63: '비', 65: '강한 비',
    71: '눈', 73: '눈', 75: '많은 눈', 80: '소나기', 81: '소나기', 82: '강한 소나기', 95: '천둥번개'
  };
  fetch('https://api.open-meteo.com/v1/forecast?latitude=37.26&longitude=127.03&current=temperature_2m,weather_code&timezone=Asia%2FSeoul')
    .then(res => res.json())
    .then(data => {
      const temp = Math.round(data.current.temperature_2m);
      const name = weatherNames[data.current.weather_code] || '날씨 정보';
      document.getElementById('weather').textContent = name + ' ' + temp + '도';
    })
    .catch(() => {
      const w = document.getElementById('weather');
      w.textContent = '날씨를 불러오지 못했어요. 새로고침해 주세요';
      w.style.fontSize = '1rem';
    });

  /* ===== 5. 사진 크게 보기 ===== */
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewerImg');
  const viewerText = document.getElementById('viewerText');
  document.querySelectorAll('.gallery img').forEach(img => {
    img.onclick = () => {
      viewerImg.src = img.src;
      viewerImg.alt = img.alt;
      viewerText.textContent = img.dataset.caption;
      viewer.classList.add('open');
    };
  });
  function closeViewer() { viewer.classList.remove('open'); }
  document.getElementById('viewerClose').onclick = closeViewer;
  viewer.onclick = (e) => { if (e.target === viewer) closeViewer(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeViewer(); });

  /* ===== 6. 음악 켜기 ===== */
  const music = document.getElementById('music');
  const musicBtn = document.getElementById('musicBtn');
  const musicNote = document.getElementById('musicNote');
  musicBtn.onclick = () => {
    if (music.paused) {
      music.play()
        .then(() => { musicBtn.textContent = '음악 끄기'; musicBtn.classList.add('playing'); musicNote.textContent = ''; })
        .catch(() => { musicNote.textContent = '폴더에 music.mp3 파일이 있는지 확인해 주세요'; });
    } else {
      music.pause();
      musicBtn.textContent = '음악 켜기';
      musicBtn.classList.remove('playing');
    }
  };
</script>
</body>
</html>
